<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clear TV Islamic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Two picture layers, so one place cross-fades into the next. -->
  <div class="wall" id="wallA"></div>
  <div class="wall" id="wallB"></div>
  <div id="dim"></div>
  <div id="glow"></div>

  <header>
    <div class="clock">
      <span id="time">--:--</span>
      <span class="clock-side"><span id="ampm"></span><span id="date"></span></span>
    </div>
    <nav class="pills">
      <button class="pill" id="inputs" data-launch="com.webos.app.inputpicker">
        <svg viewBox="0 0 24 24"><path d="M21,3.01H3c-1.1,0 -2,0.9 -2,2V9h2V4.99h18v14.03H3V15H1v4.01c0,1.1 0.9,1.98 2,1.98h18c1.1,0 2,-0.88 2,-1.98v-14c0,-1.11 -0.9,-2 -2,-2zM11,16l4,-4 -4,-4v3H1v2h10v3z"/></svg>
        <span>Inputs</span>
      </button>
      <button class="pill round" id="settings" data-launch="com.palm.app.settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
      </button>
    </nav>
  </header>

  <section id="hero">
    <h1 id="placeName"></h1>
    <h2 id="placeCountry"></h2>
    <p id="placeText"></p>
  </section>

  <!-- The selection: one pane that glides from place to place, behind whatever it selects. -->
  <div id="glider"></div>

  <main id="rows"></main>

  <script src="places.js"></script>
  <script src="app.js"></script>
</body>
</html>
